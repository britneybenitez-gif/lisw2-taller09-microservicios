server:
  port: 8084
  error:
    include-message: always
spring:
  datasource:
    url: jdbc:h2:file:./data/lifecycle;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:saberpro}
    password: ${SPRING_RABBITMQ_PASSWORD:saberpro123}
    listener:
      simple:
        default-requeue-rejected: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
